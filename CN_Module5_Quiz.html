<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CN Module 5 Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0d0f14;--surface:#161920;--surface2:#1e2130;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--accent:#f76f8e;--accent-soft:rgba(247,111,142,0.12);--success:#34d48a;--success-soft:rgba(52,212,138,0.1);--danger:#f76f6f;--danger-soft:rgba(247,111,111,0.1);--text:#e8eaf0;--text-muted:#7a7f94;--text-dim:#4a5068;--mono:'Space Mono',monospace;--sans:'Sora',sans-serif;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;}
  body::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(247,111,142,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;}
  .header{text-align:center;margin-bottom:2.5rem;position:relative;z-index:1;}
  .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(247,111,142,0.2);padding:4px 12px;border-radius:99px;margin-bottom:1rem;}
  h1{font-size:clamp(22px,4vw,32px);font-weight:600;letter-spacing:-0.03em;color:#fff;line-height:1.2;margin-bottom:0.5rem;}
  .subtitle{font-size:14px;color:var(--text-muted);font-weight:300;}
  .quiz-wrap{width:100%;max-width:660px;position:relative;z-index:1;}
  .progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .progress-label{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
  .progress-track{width:100%;height:3px;background:var(--surface2);border-radius:99px;margin-bottom:1.75rem;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#f76f8e, #ffadc0);border-radius:99px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);}
  .q-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.75rem;margin-bottom:1rem;animation:fadeUp 0.3s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .section-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:14px;}
  .section-badge::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0.5;}
  .q-text{font-size:16px;font-weight:500;line-height:1.6;color:#fff;margin-bottom:1.25rem;}
  .options{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;font-size:14px;color:var(--text);font-family:var(--sans);text-align:left;transition:all 0.15s ease;}
  .opt:hover:not(:disabled){background:#252a3a;border-color:var(--border2);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--success-soft);border-color:rgba(52,212,138,0.3);color:var(--success);}
  .opt.wrong{background:var(--danger-soft);border-color:rgba(247,111,111,0.3);color:var(--danger);}
  .opt.revealed{background:rgba(52,212,138,0.06);border-color:rgba(52,212,138,0.2);color:rgba(52,212,138,0.6);}
  .opt-letter{font-family:var(--mono);font-size:11px;font-weight:700;min-width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .feedback{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.6;display:none;}
  .feedback.show{display:block;animation:fadeUp 0.2s ease;}
  .feedback.correct{background:var(--success-soft);color:var(--success);border:1px solid rgba(52,212,138,0.15);}
  .feedback.wrong{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(247,111,111,0.15);}
  .next-btn{display:flex;align-items:center;gap:8px;margin-top:1rem;padding:11px 22px;background:var(--accent-soft);border:1px solid rgba(247,111,142,0.25);border-radius:10px;color:var(--accent);font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;}
  .next-btn:hover{background:rgba(247,111,142,0.2);}
  .next-btn .arrow{transition:transform 0.15s;}
  .next-btn:hover .arrow{transform:translateX(3px);}
  .results{text-align:center;padding:3rem 1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;animation:fadeUp 0.4s ease;}
  .score-ring{width:120px;height:120px;margin:0 auto 1.5rem;position:relative;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  .score-pct{font-family:var(--mono);font-size:26px;font-weight:700;color:#fff;}
  .score-sub{font-size:10px;color:var(--text-muted);margin-top:2px;}
  .result-title{font-size:20px;font-weight:600;color:#fff;margin-bottom:8px;}
  .result-msg{font-size:14px;color:var(--text-muted);line-height:1.6;max-width:360px;margin:0 auto 1.75rem;}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.75rem;}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .stat-n{font-family:var(--mono);font-size:22px;font-weight:700;margin-bottom:4px;}
  .stat-n.green{color:var(--success);} .stat-n.red{color:var(--danger);} .stat-n.acc{color:var(--accent);}
  .stat-l{font-size:11px;color:var(--text-muted);}
  .restart-btn{padding:12px 28px;background:transparent;border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:14px;cursor:pointer;transition:all 0.15s;}
  .restart-btn:hover{background:var(--surface2);}
</style>
</head>
<body>
<div class="header">
  <div class="tag">Ch. 9 & 12 · DS360 · SEU</div>
  <h1>CN Module 5 Quiz</h1>
  <p class="subtitle">Data Link Layer & MAC</p>
</div>
<div class="quiz-wrap">
  <div class="progress-row">
    <span class="progress-label" id="prog-label">1 of 31</span>
    <span class="progress-label" id="score-live">Score: 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  <div id="quiz-body"></div>
</div>
<script>
const questions=[{"section": "Data Link Layer", "q": "Communication at the data-link layer is described as what type?", "opts": ["End-to-end between source and destination hosts", "Hop-to-hop (node-to-node) — each frame travels from one node to the next along the path", "Bit-to-bit across the physical medium", "Session-to-session between applications"], "ans": 1, "exp": "Communication at the data-link layer is node-to-node (hop-to-hop). A data unit from one point needs to pass through many networks (LANs and WANs) connected by routers to reach another point."}, {"section": "Data Link Layer", "q": "What is 'framing' as a service of the data-link layer?", "opts": ["Physically connecting cables", "Encapsulating the datagram (from the network layer) in a frame before sending to the next node, and decapsulating it at the receiver", "Routing packets between different networks", "Encrypting data for secure transmission"], "ans": 1, "exp": "Framing: the data-link layer at each node needs to encapsulate the datagram received from the network layer in a frame before sending it to the next node. The node also needs to decapsulate the datagram from the received frame."}, {"section": "Data Link Layer", "q": "What is flow control as a data-link layer service?", "opts": ["Controlling the routing of packets", "Detecting and correcting errors in frames", "Managing the rate of frame production vs. consumption — buffering frames when the sender produces frames faster than the receiver can consume them", "Dividing data into smaller packets"], "ans": 2, "exp": "Flow Control: if the rate of produced frames is higher than the rate of consumed frames, frames at the receiving end need to be buffered. Flow control manages the rate of frame production vs. consumption."}, {"section": "Data Link Layer", "q": "What are the two categories of links at the data-link layer?", "opts": ["Wired and wireless", "Fast and slow", "Point-to-point link and broadcast link", "LAN and WAN"], "ans": 2, "exp": "The data-link layer can use a point-to-point link (uses the whole capacity of the medium for two devices) or a broadcast link (multiple stations share the medium). Traditional phone calls are point-to-point; cellular phones use a broadcast link."}, {"section": "Data Link Layer", "q": "What are the two sublayers of the data-link layer and what does each handle?", "opts": ["TCP (transport) and IP (network)", "DLC (Data Link Control) — handles issues common to both point-to-point and broadcast links; MAC (Media Access Control) — handles issues specific to broadcast links only", "Physical and Logical sublayers", "Encoding and Decoding sublayers"], "ans": 1, "exp": "The data-link layer divides into two sublayers: DLC (Data Link Control), which deals with all issues common to both point-to-point and broadcast links; and MAC (Media Access Control), which deals only with issues specific to broadcast links."}, {"section": "Link-Layer Addressing", "q": "Why can't we rely on IP addresses alone to deliver data in an internetwork?", "opts": ["IP addresses are not globally unique", "IP addresses define the two endpoints but cannot define which specific links the packet should pass through — link-layer addresses are needed for hop-by-hop delivery", "IP addresses are too short for modern networks", "IP addresses only work within a single LAN"], "ans": 1, "exp": "The source and destination IP addresses define the two ends but cannot define which links the packet should pass through. Link-layer addresses (MAC addresses) are needed to move frames through each individual link."}, {"section": "Link-Layer Addressing", "q": "What are the other names for a link-layer address?", "opts": ["IP address, subnet mask, and default gateway", "Link address, physical address, hardware address, and MAC address", "Port number, socket, and endpoint", "Domain name, hostname, and URL"], "ans": 1, "exp": "A link-layer address is sometimes called a link address, sometimes a physical address, sometimes a hardware address, and sometimes a MAC address."}, {"section": "Link-Layer Addressing", "q": "What happens to the link-layer addresses each time a frame moves from one link to another?", "opts": ["They stay the same throughout the entire journey", "They are changed every time the frame moves from one link to another", "Only the source address changes; the destination address stays the same", "Only the destination address changes; the source address stays the same"], "ans": 1, "exp": "When a datagram passes from the network layer to the data-link layer, two data-link addresses are added. These two addresses are changed every time the frame moves from one link to another, while the IP addresses remain the same end-to-end."}, {"section": "Link-Layer Addressing", "q": "In Ethernet, how large is a MAC address and how is it represented?", "opts": ["16 bits, represented as 4 hex digits", "32 bits, represented as dotted decimal (like IP)", "48 bits (six bytes), represented as 12 hexadecimal digits separated by colons", "64 bits, represented as 16 hex digits"], "ans": 2, "exp": "The link-layer addresses in Ethernet are 48 bits (six bytes), presented as 12 hexadecimal digits separated by colons (e.g., A2:34:45:11:92:F1)."}, {"section": "Link-Layer Addressing", "q": "How do you identify a unicast MAC address vs. a multicast MAC address in Ethernet?", "opts": ["Unicast ends in FF; multicast ends in 00", "In unicast, the second digit is an even number; in multicast, the second digit is an odd number in hexadecimal", "Unicast has all zeros; multicast has all ones", "Unicast uses 32 bits; multicast uses 64 bits"], "ans": 1, "exp": "For a unicast address, the second digit needs to be an even number. For a multicast address, the second digit needs to be an odd number in hexadecimal."}, {"section": "Link-Layer Addressing", "q": "What is the broadcast MAC address in Ethernet?", "opts": ["00:00:00:00:00:00 (all zeros)", "All ones in all 48 bits — represented as FF:FF:FF:FF:FF:FF", "The address of the default router", "A randomly assigned 48-bit address"], "ans": 1, "exp": "The broadcast link-layer address in Ethernet consists of 48 bits, all 1s, represented as FF:FF:FF:FF:FF:FF in hexadecimal."}, {"section": "ARP", "q": "What problem does ARP solve?", "opts": ["It assigns IP addresses to devices dynamically", "It routes packets between different networks", "A node has the IP address of the next node but needs its link-layer (MAC) address to send a frame — ARP maps the IP address to the corresponding MAC address", "It encrypts data at the link layer"], "ans": 2, "exp": "When a node has an IP datagram to send, it has the IP address of the receiving node but needs the link-layer address. ARP accepts an IP address from the IP protocol, maps it to the corresponding link-layer address, and passes it to the data-link layer."}, {"section": "ARP", "q": "Where does ARP sit in the TCP/IP protocol suite?", "opts": ["At the application layer", "Between the network layer and the transport layer", "Between the network layer and the data-link layer", "At the physical layer"], "ans": 2, "exp": "ARP sits between the network layer and the data-link layer. It accepts an IP address from the IP protocol (network layer) and maps it to a link-layer address for the data-link layer."}, {"section": "Multiple Access", "q": "What is a multiple-access protocol used for?", "opts": ["To increase network speed", "To coordinate access to a shared (multipoint or broadcast) link when multiple nodes or stations are connected to it", "To encrypt data on shared links", "To route packets between different networks"], "ans": 1, "exp": "When nodes or stations are connected and use a shared link (multipoint or broadcast), we need a multiple-access protocol to coordinate access to the link. All these protocols belong to the MAC sublayer of the data-link layer."}, {"section": "Multiple Access", "q": "What are the three categories of multiple-access protocols?", "opts": ["Wired, wireless, and optical", "Simplex, half-duplex, and full-duplex", "Random access, controlled access, and channelization", "FDMA, TDMA, and CDMA only"], "ans": 2, "exp": "Multiple-access protocols fall into three categories: Random Access (contention methods), Controlled Access (stations consult each other), and Channelization (bandwidth divided by frequency, time, or code)."}, {"section": "Random Access", "q": "In random access methods, what does each station decide before sending?", "opts": ["It waits for the primary device to give permission", "It reserves a time slot in advance", "Based on the state of the medium (idle or busy), each station uses the protocol's defined procedure to decide whether or not to send", "It waits for a token to arrive"], "ans": 2, "exp": "In random-access (contention) methods, no station is superior to another. Each station that has data to send uses a procedure defined by the protocol to decide whether or not to send, based on the state of the medium."}, {"section": "Random Access", "q": "What is ALOHA and where was it originally developed?", "opts": ["A wired LAN standard developed in California in the 1990s", "The earliest random-access method, developed at the University of Hawaii in the early 1970s for a radio (wireless) LAN", "A controlled-access method for token ring networks", "A channelization protocol developed by IEEE"], "ans": 1, "exp": "ALOHA, the earliest random-access method, was developed at the University of Hawaii in early 1970. It was designed for a radio (wireless) LAN but can be used on any shared medium. When two stations transmit at the same time, their data collides and becomes garbled."}, {"section": "Random Access", "q": "What is the principle behind CSMA (Carrier Sense Multiple Access)?", "opts": ["Send data without checking the medium first", "Check the medium after sending to detect collisions", "Sense before transmit — each station first listens to the medium to check if it is idle before sending", "Reserve a time slot before transmitting"], "ans": 2, "exp": "CSMA requires that each station first listen to the medium (check the state of the medium) before sending. It is based on the principle 'sense before transmit' or 'listen before talk.' This reduces collisions but cannot eliminate them."}, {"section": "Random Access", "q": "Why can CSMA reduce but NOT eliminate collisions?", "opts": ["Because stations ignore the protocol", "Because some stations are too far apart", "Because of propagation delay — a station may sense the medium as idle because another station's signal hasn't reached it yet", "Because the medium has unlimited bandwidth"], "ans": 2, "exp": "CSMA cannot eliminate collisions because of propagation delay. A station may sense the medium and find it idle because the first bit sent by another station has not yet arrived. The two stations transmit simultaneously, causing a collision."}, {"section": "Random Access", "q": "What does CSMA/CD add to CSMA?", "opts": ["It listens before transmitting (added to CSMA)", "It monitors the medium after sending a frame — if a collision is detected, the frame is sent again", "It avoids collisions by using acknowledgments", "It divides time into slots for each station"], "ans": 1, "exp": "CSMA/CD (Collision Detection) augments the CSMA algorithm. In this method, a station monitors the medium after it sends a frame. If the transmission was successful, it's done. If a collision occurred, the frame is sent again."}, {"section": "Random Access", "q": "What was CSMA/CA designed for, and how does it avoid collisions?", "opts": ["Designed for wired Ethernet; avoids collisions by detecting them after they occur", "Designed for wireless networks; avoids collisions through three strategies: interframe space (IFS), contention window, and acknowledgments", "Designed for fiber-optic networks; avoids collisions by using token passing", "Designed for satellite networks; avoids collisions by reserving time slots"], "ans": 1, "exp": "CSMA/CA (Collision Avoidance) was designed for wireless networks. It avoids collisions through three strategies: interframe space (IFS), contention window, and acknowledgments. It avoids rather than detects collisions."}, {"section": "Random Access", "q": "What are the three persistence methods in CSMA, and which has the highest chance of collision?", "opts": ["Unicast, multicast, and broadcast", "FDMA, TDMA, and CDMA", "1-persistent (sends immediately when idle — highest collision chance), nonpersistent (waits random time when busy — lower collision chance), and p-persistent (sends with probability p when idle)", "Synchronous, asynchronous, and isochronous"], "ans": 2, "exp": "Three persistence methods: 1-persistent — sends immediately when line is idle, has the highest chance of collision; nonpersistent — waits a random time when busy, reduces collision chance but reduces efficiency; p-persistent — sends with probability p when idle."}, {"section": "Controlled Access", "q": "In controlled access, what is required before a station can send?", "opts": ["Only that the medium is idle", "Nothing — any station can send whenever it wants", "The station must be authorized by other stations through consultation", "The station must hold the token and have a reserved time slot"], "ans": 2, "exp": "In controlled access, the stations consult one another to find which station has the right to send. A station cannot send unless it has been authorized by other stations."}, {"section": "Controlled Access", "q": "In the reservation controlled-access method, how is transmission organized?", "opts": ["Stations send whenever the medium is idle", "A primary station polls secondary stations in turn", "Time is divided into intervals; a reservation frame precedes data frames in each interval — stations must reserve a slot before sending", "Stations pass a token around a logical ring"], "ans": 2, "exp": "In the reservation method, time is divided into intervals. In each interval, a reservation frame precedes the data frames. Stations make reservations in the reservation frame, and only reserved stations send data in that interval."}, {"section": "Controlled Access", "q": "In the polling method, what is the role of the primary device?", "opts": ["It receives data only", "It controls the link — the select function sends data to secondary devices; the poll function asks secondary devices if they have data to send", "It broadcasts to all stations simultaneously", "It passes the token to other devices"], "ans": 1, "exp": "In polling, the primary device controls the link. The select function is used when the primary device has data to send to a secondary device. The poll function is used when the primary device wants to receive data — it asks secondary devices if they are ready to send."}, {"section": "Controlled Access", "q": "In the token-passing method, how is the right to transmit determined?", "opts": ["The primary station grants permission", "Any station can transmit when the medium is idle", "Stations are organized in a logical ring; a station can only transmit when it holds the token, which circulates from one station to the next", "Stations use reservation frames to request transmission time"], "ans": 2, "exp": "In token passing, stations are organized in a logical ring (with predecessors and successors). The right to transmit is granted by holding the token. A station can transmit when it holds the token, then passes it to the next station."}, {"section": "Channelization", "q": "In FDMA (Frequency-Division Multiple Access), how is bandwidth shared?", "opts": ["Time is divided into slots for each station", "Each station is assigned a unique code", "The available bandwidth is divided into frequency bands — each station is allocated a band that belongs to it all the time", "All stations transmit simultaneously using different timing"], "ans": 2, "exp": "In FDMA, the available bandwidth is divided into frequency bands (channels). Each station is allocated a band to send its data — it belongs to the station all the time. Guard bands separate the allocated bands to prevent station interference."}, {"section": "Channelization", "q": "In TDMA (Time-Division Multiple Access), how is bandwidth shared?", "opts": ["Each station gets a permanent frequency band", "Each station gets a unique code to transmit simultaneously with others", "The bandwidth is shared in time — each station is allocated a time slot during which it can send data", "The bandwidth is physically divided into separate cables"], "ans": 2, "exp": "In TDMA, the stations share the bandwidth of the channel in time. Each station is allocated a time slot during which it can send data. Each station transmits in its assigned time slot."}, {"section": "Channelization", "q": "How does CDMA differ from both FDMA and TDMA?", "opts": ["CDMA uses physical separation of cables", "CDMA uses one channel for the entire bandwidth (unlike FDMA) AND allows all stations to send simultaneously (unlike TDMA) — using unique chip codes assigned to each station", "CDMA is an older technology that preceded both", "CDMA uses the same principles as TDMA but with coding"], "ans": 1, "exp": "CDMA differs from FDMA because only one channel occupies the entire bandwidth. It differs from TDMA because all stations can send simultaneously — no timesharing. CDMA is based on coding theory; each station is assigned a unique code (sequence of chips)."}, {"section": "Channelization", "q": "In FDMA, what are guard bands and why are they used?", "opts": ["Physical separators between cables", "Time gaps between transmission slots", "Small frequency gaps that separate the allocated frequency bands to prevent stations from interfering with each other", "Error detection codes added between data frames"], "ans": 2, "exp": "To prevent station interference in FDMA, the allocated bands are separated from one another by small guard bands — small frequency gaps that keep adjacent channels from interfering with each other."}, {"section": "Data Link Layer", "q": "What is error control at the data-link layer?", "opts": ["Preventing collisions on the shared medium", "Controlling the flow of frames between nodes", "Detecting errors in received frames and either correcting them at the receiver or discarding and requesting retransmission from the sender", "Assigning addresses to frames"], "ans": 2, "exp": "Error Control: since electromagnetic signals are susceptible to error, frames can contain errors. The error needs to be detected first. After detection, it is either corrected at the receiver node or discarded and retransmitted by the sending node."}];
const shuffled=[...questions].sort(()=>Math.random()-0.5);
let current=0,score=0,answered=false;
function render(){
  const body=document.getElementById('quiz-body'),total=shuffled.length;
  if(current>=total){
    const pct=Math.round((score/total)*100);
    const title=pct>=80?"Excellent work!":pct>=60?"Good effort!":"Keep studying!";
    const msg=pct>=80?"You have a strong grasp of this module.":pct>=60?"Review the topics you missed and try again.":"Go back over the slides and give it another shot.";
    const c=2*Math.PI*50,d=(pct/100)*c;
    const col=pct>=80?'#34d48a':pct>=60?'#f76f8e':'#f76f6f';
    document.getElementById('prog-fill').style.width='100%';
    document.getElementById('prog-label').textContent='Complete';
    document.getElementById('score-live').textContent='';
    body.innerHTML=`<div class="results"><div class="score-ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8"/><circle cx="60" cy="60" r="50" fill="none" stroke="${col}" stroke-width="8" stroke-dasharray="${d.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round"/></svg><div class="score-center"><div class="score-pct">${pct}%</div><div class="score-sub">${score}/${total}</div></div></div><div class="result-title">${title}</div><div class="result-msg">${msg}</div><div class="stats-grid"><div class="stat"><div class="stat-n green">${score}</div><div class="stat-l">Correct</div></div><div class="stat"><div class="stat-n red">${total-score}</div><div class="stat-l">Incorrect</div></div><div class="stat"><div class="stat-n acc">${total}</div><div class="stat-l">Total</div></div></div><button class="restart-btn" onclick="restart()">↺ Restart quiz</button></div>`;
    return;
  }
  const q=shuffled[current];
  document.getElementById('prog-fill').style.width=`${(current/shuffled.length)*100}%`;
  document.getElementById('prog-label').textContent=`${current+1} of ${total}`;
  document.getElementById('score-live').textContent=`Score: ${score}`;
  body.innerHTML=`<div class="q-card"><div class="section-badge">${q.section}</div><div class="q-text">${q.q}</div><div class="options" id="opts">${q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})"><span class="opt-letter">${['A','B','C','D'][i]}</span>${o}</button>`).join('')}</div><div class="feedback" id="fb"></div></div><div id="next-wrap"></div>`;
  answered=false;
}
function pick(i){
  if(answered)return;answered=true;
  const q=shuffled[current];
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  if(i===q.ans){document.getElementById('opt'+i).classList.add('correct');fb.className='feedback correct show';fb.innerHTML='<strong>Correct!</strong> '+q.exp;score++;}
  else{document.getElementById('opt'+i).classList.add('wrong');document.getElementById('opt'+q.ans).classList.add('revealed');fb.className='feedback wrong show';fb.innerHTML='<strong>Incorrect.</strong> '+q.exp;}
  document.getElementById('score-live').textContent=`Score: ${score}`;
  document.getElementById('next-wrap').innerHTML=`<button class="next-btn" onclick="next()">${current+1<shuffled.length?'Next question':'See results'} <span class="arrow">→</span></button>`;
}
function next(){current++;render();}
function restart(){current=0;score=0;render();}
